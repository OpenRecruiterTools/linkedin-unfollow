name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A tag never ships something that does not pass.
      - run: npm run lint
      - run: npm test

      - name: Build the zip
        run: npm run zip

      # The tag and manifest.json must agree, or people download a zip whose
      # version is not the one they clicked on.
      - name: Check the tag matches manifest.json
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi

      # Two files, the same bytes: the versioned name for the release page, and
      # the fixed name the site's Download button links to via
      # /releases/latest/download/linkedin-unfollow.zip
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/linkedin-unfollow-v*.zip
            dist/linkedin-unfollow.zip
